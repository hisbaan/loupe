[package]
name = "loupe-gateway"
version = "0.1.0"
description = "Sign in with ChatGPT for Loupe, run on your own machine"
repository = "https://github.com/hisbaan/loupe"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
loupe-protocol = { version = "0.1.0", path = "../crates/protocol" }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
webbrowser = "1.2.7"
